name: validate-architecture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static architecture validation only
        run: python3 scripts/verify_architecture.py
# This workflow does not deploy services, modify CloudBase, or contain production credentials.
