name: validate-architecture
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static architecture validation only
        run: python3 scripts/verify_architecture.py
      - name: Validate agent change routing and database namespaces
        run: python3 scripts/verify_change_routing.py
      - name: V4.2 R3.2 G0 evidence coverage and no false host promotion
        run: python3 scripts/verify_v42_g0.py
  bsv1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BSV1 integration tests
        run: bash tests/bsv1/check.sh
      - name: Install locked PostgreSQL client
        run: python -m pip install psycopg==3.2.13 psycopg-binary==3.2.13
      - name: Install POS catalog browser test runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: PostgreSQL 17 catalog migration, protected reads and rollback
        run: bash tests/bsv1/catalog_pg17.sh
      - name: Isolated Lighthouse release simulation
        run: bash platform/lighthouse/bsv1/release.sh --simulate
  menu-v13-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright==1.62.0 jsonschema==4.26.0
          python3 -m playwright install --with-deps chromium
      - name: Validate menu, POS projection and preview build
        run: bash tests/menu-v13-1/check.sh
  supply-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked supply dependencies
        run: python -m pip install -r services/api/supply/requirements.lock
      - name: Validate supply, inventory and quality integration
        run: bash tests/supply/check.sh
  identity-r2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked identity dependencies
        run: python -m pip install -r services/api/identity/requirements.lock
      - name: Install isolated HQ map browser runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Identity, POS and supply integration
        run: bash tests/identity/check.sh
        env:
          BSV_G1_UI_ARTIFACTS: ${{ runner.temp }}/bsv-g1-ui
      - name: Upload isolated G1 three-store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-three-store-pos-browser
          path: ${{ runner.temp }}/bsv-g1-ui
          if-no-files-found: warn
      - name: PostgreSQL 17 migration, concurrency, encrypted recovery
        run: bash tests/identity/pg/check.sh
  db-contract-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked identity and test dependencies
        run: |
          python -m pip install -r services/api/identity/requirements.lock
          python -m pip install playwright==1.62.0 jsonschema==4.26.0
          python -m playwright install --with-deps chromium
      - name: Validate PG17 contract and all four application boundaries
        run: bash tests/db_preflight/check.sh
  lighthouse-internal-stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser script syntax
        run: |
          for file in apps/hq-console/identity/hq.js apps/staff-center/identity/assets/*.js apps/staff-center/identity/workbench.js apps/hq-console/supply/app.js apps/store-console/bsv1/app.js; do
            node --check "$file"
          done
      - name: Audit the tracked final deployment shell artifact
        run: |
          python -m pip install ruff==0.14.0
          python tests/internal-stage/test_run_once_artifact.py
      - name: Build independent locked environments
        run: |
          python -m venv "$RUNNER_TEMP/bsv-identity"
          python -m venv "$RUNNER_TEMP/bsv-supply"
          "$RUNNER_TEMP/bsv-identity/bin/python" -m pip install -r services/api/identity/requirements.lock
          "$RUNNER_TEMP/bsv-supply/bin/python" -m pip install -r services/api/supply/requirements.lock
          "$RUNNER_TEMP/bsv-identity/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/bsv-identity/bin/python" -m playwright install --with-deps chromium
      - name: Run actual HTTP integration with isolated PostgreSQL
        run: |
          export PATH="$RUNNER_TEMP/bsv-identity/bin:$PATH"
          export BSV_STAGE_SUPPLY_PYTHON="$RUNNER_TEMP/bsv-supply/bin/python"
          export BSV_STAGE_BROWSER=1
          export BSV_STAGE_UI_ARTIFACTS="$RUNNER_TEMP/bsv-stage-ui"
          bash tests/identity/pg/check.sh --with-apps
          python tests/internal-stage/test_deploy.py
          python tests/internal-stage/test_control.py
          python platform/lighthouse/internal-stage/stage.py --help
          bash -n platform/lighthouse/internal-stage/run.sh
      - name: Upload isolated UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-stage-ui
          path: ${{ runner.temp }}/bsv-stage-ui
          if-no-files-found: warn
  v4-1-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build locked V4.1 test environments
        run: |
          python -m venv "$RUNNER_TEMP/bsv-identity"
          python -m venv "$RUNNER_TEMP/bsv-supply"
          "$RUNNER_TEMP/bsv-identity/bin/python" -m pip install -r services/api/identity/requirements.lock playwright==1.62.0
          "$RUNNER_TEMP/bsv-supply/bin/python" -m pip install -r services/api/supply/requirements.lock
          "$RUNNER_TEMP/bsv-identity/bin/python" -m playwright install --with-deps chromium
      - name: Validate import and run upgraded PG17 real HTTP and browser flows
        run: |
          export PATH="$RUNNER_TEMP/bsv-identity/bin:$PATH"
          export BSV_STAGE_SUPPLY_PYTHON="$RUNNER_TEMP/bsv-supply/bin/python"
          export BSV_V41_BROWSER=1
          export BSV_V41_UI_ARTIFACTS="$RUNNER_TEMP/v41-ui"
          python3 -m unittest discover -s tests/ingestion
          bash tests/v4-1/check.sh
      - name: Upload isolated V4.1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-1-isolated-browser
          path: ${{ runner.temp }}/v41-ui
          if-no-files-found: warn

  customer-growth-v43:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install candidate dependencies and pinned ingress extras
        run: |
          python -m pip install -r services/api/customer_growth/requirements.txt pytest
          python -m pip install --no-deps -r services/api/customer_growth/requirements.stage.lock
          python -m pip check
      - name: Verify candidate registration, attribution, consent and POS-context denials
        run: |
          python -m pytest -q tests/customer_growth/test_flow.py tests/customer_growth/test_service_preferences.py tests/customer_growth/test_pos_contract.py
          python -m compileall -q services/api/customer_growth services/api/bsv1/bsv_growth_pos.py platform/lighthouse/internal-stage
          node --check apps/store-console/bsv1/app.js
          node --check apps/guest-web/member/app.js
          node --check apps/staff-center/growth/app.js
          node --check apps/staff-center/growth/pos-entry.js
