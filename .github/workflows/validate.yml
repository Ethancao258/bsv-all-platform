name: validate-architecture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static architecture validation only
        run: python3 scripts/verify_architecture.py
      - name: Validate agent change routing and database namespaces
        run: python3 scripts/verify_change_routing.py
  bsv1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BSV1 integration tests
        run: bash tests/bsv1/check.sh
      - name: Isolated Lighthouse release simulation
        run: bash platform/lighthouse/bsv1/release.sh --simulate
  menu-v13-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright==1.62.0 jsonschema==4.26.0
          python3 -m playwright install --with-deps chromium
      - name: Validate menu, POS projection and preview build
        run: bash tests/menu-v13-1/check.sh
  supply-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked supply dependencies
        run: python -m pip install -r services/api/supply/requirements.lock
      - name: Validate supply, inventory and quality integration
        run: bash tests/supply/check.sh
  identity-r2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked identity dependencies
        run: python -m pip install -r services/api/identity/requirements.lock
      - name: Identity, POS and supply integration
        run: bash tests/identity/check.sh
      - name: PostgreSQL 17 migration, concurrency, encrypted recovery
        run: bash tests/identity/pg/check.sh
  db-contract-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked identity and test dependencies
        run: |
          python -m pip install -r services/api/identity/requirements.lock
          python -m pip install playwright==1.62.0 jsonschema==4.26.0
          python -m playwright install --with-deps chromium
      - name: Validate PG17 contract and all four application boundaries
        run: bash tests/db_preflight/check.sh
  lighthouse-internal-stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HQ browser script syntax
        run: node --check apps/hq-console/identity/hq.js
      - name: Build independent locked environments
        run: |
          python -m venv "$RUNNER_TEMP/bsv-identity"
          python -m venv "$RUNNER_TEMP/bsv-supply"
          "$RUNNER_TEMP/bsv-identity/bin/python" -m pip install -r services/api/identity/requirements.lock
          "$RUNNER_TEMP/bsv-supply/bin/python" -m pip install -r services/api/supply/requirements.lock
      - name: Run actual HTTP integration with isolated PostgreSQL
        run: |
          export PATH="$RUNNER_TEMP/bsv-identity/bin:$PATH"
          export BSV_STAGE_SUPPLY_PYTHON="$RUNNER_TEMP/bsv-supply/bin/python"
          bash tests/identity/pg/check.sh --with-apps
          python tests/internal-stage/test_deploy.py
          python platform/lighthouse/internal-stage/stage.py --help
          bash -n platform/lighthouse/internal-stage/run.sh
