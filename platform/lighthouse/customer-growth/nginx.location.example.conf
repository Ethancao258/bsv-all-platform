# Include ONLY inside an already verified HTTPS server{} for the approved bsvm.cn subdomain.
# Avoid overwriting existing /staff, /api, /cocktail, /craft or EdgeOne routes.
# This is a candidate; confirm actual ingress, upstream and TLS/ICP before activation.

location = /api/v1/growth/internal/payment-event {
  allow 127.0.0.1;
  allow ::1;
  deny all;
  proxy_pass http://127.0.0.1:8767;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/v1/growth/internal/benefits/reserve {
  allow 127.0.0.1;
  allow ::1;
  deny all;
  proxy_pass http://127.0.0.1:8767;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/v1/growth/ {
  proxy_pass http://127.0.0.1:8767;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /member/ {
  proxy_pass http://127.0.0.1:8767;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /staff/growth/ {
  proxy_pass http://127.0.0.1:8767;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
