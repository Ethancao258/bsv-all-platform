<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>总部商品与数据库 · BSV ALL</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/hq-assets/catalog.css"><script defer src="/hq-assets/catalog.js"></script></head>
<body><header><div class="brand"><a href="/">BAR ST. VINCENT</a><small>总部商品与数据库</small></div><nav><a href="/">返回工作台</a><a href="/hq">总部权限</a></nav></header>
<main class="catalog-main"><section class="catalog-title"><div><p class="eyebrow">BSV ALL / CATALOG</p><h1>商品与数据库管理</h1><p>在同一处管理商品、套餐、预调、供货物料、配方及门店报价。</p></div><button id="refresh" type="button">刷新活动版本</button></section>
<p id="notice" role="status" aria-live="polite">正在核验统一身份与活动目录…</p><section class="panel"><h2>当前数据版本</h2><p id="source">未核验</p><p class="small">候选版：审核只生成待发布资料，不修改经营数据库，不自动上架。</p></section>
<div id="counts" class="catalog-counts"></div>
<section class="panel"><h2>商品资料</h2><div class="catalog-toolbar"><label>资料类别<select id="domain"><option value="C">现场成品</option><option value="K">套餐组合</option><option value="P">预调半成品</option><option value="M">采购纯饮 / 供货物料</option><option value="R">配方耗用</option><option value="Q">门店报价</option><option value="T">门店注册（只读）</option></select></label><label>搜索名称或固定ID<input id="search" type="search" maxlength="100"></label><button id="searchBtn">搜索</button><button id="newBtn">新增资料草稿</button></div><div class="catalog-work"><div><p id="total"></p><div id="records"></div><div class="catalog-toolbar"><button id="prev">上一页</button><button id="next">下一页</button></div></div><form id="edit"><h3 id="editTitle">选择资料或新增草稿</h3><label>变更类型<select id="kind"><option value="edit">修改</option><option value="create">新增</option><option value="retire">申请退役</option></select></label><label>固定编号<input id="record" readonly></label><div id="fields"></div><label>变更理由<textarea id="reason" required minlength="8" maxlength="500"></textarea></label><button id="submitEdit">提交待审核草稿</button></form></div></section>
<section class="panel"><h2>Excel 批量更新</h2><p>上传原有七表模板（当前上限4 MiB），核验活动版本并预览新增、修改及待退役。审核不等于发布。</p><label>选择 Excel<input id="file" type="file" accept=".xlsx"></label><div class="catalog-toolbar"><button id="preview">校验并预览</button><button id="submitExcel" disabled>提交该版本待审</button></div><div id="diff" aria-live="polite"></div></section>
<section class="panel"><h2>待审变更与版本操作</h2><p>由另一位获授权管理员审核。正式生效、回退和销售授权仍须经过现有版本发布流程。</p><button id="loadDrafts">刷新待审记录</button><div id="drafts"></div><form id="rollback"><h3>申请恢复历史版本</h3><label>历史版本 SHA-256<input id="targetSha" maxlength="64" pattern="[0-9a-f]{64}" required></label><label>恢复理由<textarea id="rollbackReason" minlength="8" maxlength="500" required></textarea></label><button>提交恢复申请</button></form></section>
</main></body></html>
