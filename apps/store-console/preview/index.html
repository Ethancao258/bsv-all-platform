<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSV1 门店演练</title>
<style>
body {max-width: 38rem; margin: 3rem auto; padding: 0 1.5rem; font: 1.1rem system-ui; color: #28352d; background:#f6f8f4}
button {font: inherit; margin: .3rem; padding: .4rem .8rem}
</style>
<main>
<h1>BSV1 门店演练</h1>
<p>合成商品，仅模拟点单。离开页面会清除草稿。</p>
<div id="products"></div>
<h2>点单草稿</h2>
<ul id="cart"></ul>
<p id="total" aria-live="polite">合计 ¥0.00</p>
<button id="clear" type="button">清空草稿</button>
<p id="status" role="status"></p>
</main>
<script type="module">
const cart = new Map();
const products = document.querySelector("#products");
const list = document.querySelector("#cart");
const total = document.querySelector("#total");
function render() {
  list.replaceChildren();
  let amount = 0;
  for (const {item, quantity} of cart.values()) {
    const line = document.createElement("li");
    line.textContent = item.name + " × " + quantity;
    list.append(line);
    amount += item.price_minor * quantity;
  }
  total.textContent = "合计 ¥" + (amount / 100).toFixed(2);
}
document.querySelector("#clear").onclick = () => {
  cart.clear();
  render();
};
try {
  const response = await fetch("/api/v1/menu");
  if (!response.ok) throw new Error("Menu unavailable");
  const {items} = await response.json();
  for (const item of items) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "加入" + item.name;
    button.onclick = () => {
      const quantity = (cart.get(item.product_id)?.quantity ?? 0) + 1;
      cart.set(item.product_id, {item, quantity});
      render();
    };
    products.append(button);
  }
} catch {
  document.querySelector("#status").textContent = "无法加载演练商品";
}
</script>
</html>
